experiment:
  artifact_root: ./outputs/study_180
training:
  enabled: true
  datasets: [sst2, sst5, emotion, ag_news, imdb]
  model_types: [BERT, pseudo-gen-MLM, pure-gen-GPT2, pseudo-gen-GPT2]
  model_sizes: [small, med, large]
  seeds: [40, 41, 42]
  num_samples: [null]
  epochs: 60
  train_batch_sizes: [32]
  treat_train_batch_size_as_axis: false
  learning_rate: 2.0e-5
  num_warmup_steps: 0
  use_test_as_val: false
  early_stopping_patience: 10
  seed_profile: strict
  budget_max_jobs: 180
inference:
  enabled: true
  plan_without_checkpoint: false
  checkpoints:
    selection: best_val_weighted_f1
  splits: [test]
  batch_sizes: [32]
  order_policies:
    - {name: identity, type: identity}
  runtimes:
    - {name: pytorch_fp32, backend: pytorch, dtype: fp32, quantization: none, device: cuda, seed_profile: production_like}
  num_shards: 1
